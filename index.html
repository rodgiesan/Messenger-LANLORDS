<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCL Help Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   MCL HELP DESK — visual system
   Navy rail (the campus), cool paper workspace, tickets drawn as stubs.
   Brand colors come from the Mapúa MCL stripe: navy, red, gray, blue.
   ===================================================================== */
:root{
  --navy:#001c43;--navy2:#0a2a5c;--red:#e50019;--blue:#0f4c9c;--gray:#b1b1b1;
  --head:var(--navy);--paper:#eef1f5;--card:#fff;--ink:#14213a;--tx:#14213a;--mut:#5f6b7c;--line:#dbe1e8;--line2:#c7cfd9;
  --ok:#1e7d3a;--amber:#b45309;--soft:#f4f6f9;--bg:var(--paper);
  --r:12px;--r-sm:8px;--side:232px;
  --ease:cubic-bezier(.2,.7,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  font-synthesis:none
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--tx);font:400 14px/1.55 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{font-stretch:112%;letter-spacing:-.01em}
h2{margin:0 0 12px;font-size:16px;font-weight:700;color:var(--head)}
button,select,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:0 0 14px;overflow-y:auto;
  box-shadow:inset -4px 0 0 0 transparent}
/* the brand stripe, turned vertical, runs down the rail's edge */
#side:after{content:none;display:none;position:absolute;top:0;right:0;width:4px;height:100%;background:linear-gradient(180deg,var(--navy) 0 25%,var(--red) 25% 50%,var(--gray) 50% 62%,var(--blue) 62% 100%)}
.brand{display:block;width:100%;text-align:left;background:#fff;padding:16px 18px 14px;margin-right:0;border:0;border-radius:0;cursor:pointer}
.brand:hover{background:#f4f6f9}.brand:active{transform:none}
.homebtn{display:none;border:0;background:transparent;padding:0;border-radius:6px;line-height:0}.homebtn:active{transform:none}
.brand img{height:40px;display:block}
.brand span{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--head);font-stretch:112%}
#nav{display:flex;flex-direction:column;gap:2px;padding:16px 12px 0 10px;margin:0}
#nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;color:#c9d3e3;padding:10px 12px;border-radius:var(--r-sm);font-weight:500;font-size:14px;position:relative}
#nav button svg{flex:none;opacity:.85}
#nav button:hover{background:rgba(255,255,255,.07);color:#fff}
#nav button.on{background:#fff;color:var(--head);font-weight:600}
#nav button.on:before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--red)}
#nav .cnt{margin-left:auto}
#me{margin-top:auto;padding:14px 16px 0 14px;border-top:1px solid rgba(255,255,255,.12)}
#me .who{font-weight:600;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#me .role{font-size:12px;color:#9fb0c9;margin-bottom:10px}
#me button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;color:#c9d3e3;padding:8px 6px;border-radius:var(--r-sm);font-size:13px;font-weight:500}
#me button:hover,#me button.on{background:rgba(255,255,255,.08);color:#fff}
.content{min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:14px;padding:18px 32px 0;min-height:64px}
#top .toplogo{height:42px;display:none}
#ptitle{margin:0;flex:1;font-size:24px;font-weight:700;color:var(--head);line-height:1.2;min-width:0}
#hd{display:flex;gap:8px;align-items:center}
.wrap{width:100%;max-width:1040px;padding:18px 32px 48px}
.mob{display:none!important}

/* logged out: no rail, centered brand bar */
body.out .app{display:block}
body.out #side{display:none}
body.out #top{background:#fff;padding:12px 24px;min-height:0;position:relative}
body.out #top:after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(90deg,var(--navy) 0 25%,var(--red) 25% 50%,var(--gray) 50% 62%,var(--blue) 62% 100%)}
body.out #top .toplogo{display:block}
body.out #ptitle{display:none}
body.out .wrap{margin:0 auto;padding-top:40px}

/* ---------- controls ---------- */
button{cursor:pointer;border:1px solid var(--line2);background:#fff;padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;color:var(--ink);
  transition:background-color .18s,border-color .18s,color .18s,transform .12s,box-shadow .18s}
button:hover{border-color:var(--navy)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,#nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.p{background:var(--red);border-color:var(--red);color:#fff}
button.p:hover:not(:disabled){background:#c80016;border-color:#c80016}
button.g{background:var(--navy);border-color:var(--navy);color:#fff}
button.g:hover:not(:disabled){background:var(--navy2)}
.link{border:none;background:transparent;color:var(--blue);font-weight:600;padding:8px 0 0;text-decoration:underline;text-underline-offset:3px}
.link.sm{padding:0;font-size:12px;margin:12px 0 4px;text-decoration:none}.link.sm:hover{text-decoration:underline}
.lnk{border:none;background:none;padding:0;color:var(--head);font-weight:700;text-align:left;font-size:inherit;border-radius:4px}
.lnk:hover{color:var(--red)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:#fff;transition:border-color .18s,box-shadow .18s}
input:hover,select:hover,textarea:hover{border-color:#aab4c2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(15,76,156,.15)}
textarea{resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 5px}
.pw{position:relative}.pw input{padding-right:44px}
.eye{position:absolute;right:4px;top:4px;bottom:4px;width:36px;border:none;background:transparent;color:var(--blue);display:flex;align-items:center;justify-content:center;padding:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:12px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:17px}
.okm{color:var(--ok);font-size:13px;margin-top:8px}
.caps{color:var(--amber);font-size:12px;font-weight:600;margin-top:4px}
.meter{height:5px;background:var(--soft);border-radius:99px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .35s var(--ease),background-color .35s}
.hint{font-size:13px;color:var(--mut);margin:-2px 0 14px}
code.tmp{display:inline-block;font:700 18px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;background:var(--soft);padding:6px 12px;border-radius:var(--r-sm);color:var(--head)}

/* ---------- surfaces ---------- */
.note.res{border:1px solid #a7d1b4;border-left:6px solid var(--ok);background:#f1f8f3;border-radius:var(--r-sm);padding:16px 18px;margin:16px 0 6px;font-size:14px}
.res-h{display:flex;align-items:center;gap:10px}
.res-h b{display:block;font-size:15px;color:var(--ok);font-stretch:112%}
.res-by{display:block;font-size:12px;color:var(--mut)}
.res-ic{width:32px;height:32px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.res-t{margin:12px 0 0;font-size:18px;line-height:1.5;font-weight:500;color:var(--ink);white-space:pre-wrap;word-break:break-word}
@media (max-width:860px){.res-t{font-size:16px}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.note{border-left:3px solid var(--ok);padding:8px 12px;margin:10px 0 4px;background:#f1f8f3;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:13px}
.note.mut{border-left-color:var(--line2);background:var(--soft)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid #f3c7cc;background:#fff5f6;border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:13px}
.banner span{flex:1;min-width:200px}.banner.info{border-color:#c9d8ee;background:#f3f7fd}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{color:var(--mut);font-size:12px;font-weight:600;border-bottom-color:var(--line2)}
tr:last-child td{border-bottom:0}
tr.off td{opacity:.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.grid2 .card{margin:0}

/* tags & counters */
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--mut);background:#fff;white-space:nowrap}
.Open{color:var(--red);border-color:#f2a3ad;background:#fff6f7}
.Progress{color:var(--blue);border-color:#a9c1e3;background:#f2f6fc}
.Resolved{color:var(--ok);border-color:#a7d1b4;background:#f1f8f3}
.hi{color:#fff;background:var(--red);border-color:var(--red)}
.tag.warn{color:var(--amber);border-color:#e9c393;background:#fdf6ec}
.tag.over{color:#fff;background:var(--amber);border-color:var(--amber)}
.cnt{display:inline-block;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;margin-left:6px;font-size:11px;font-weight:700;line-height:18px}
#nav button.on .cnt{background:var(--red);color:#fff}
.bell{position:relative;display:inline-flex;align-items:center;gap:8px}
.bell b{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;line-height:18px;border:2px solid var(--paper)}

/* ---------- tickets as stubs ---------- */
.tcard{display:grid;grid-template-columns:136px minmax(0,1fr);padding:0;position:relative;--pc:var(--blue)}
.tcard.p-Urgent{--pc:var(--red)}.tcard.p-High{--pc:#d97706}.tcard.p-Medium{--pc:var(--blue)}.tcard.p-Low{--pc:#8a94a3}
.stub{position:relative;padding:18px 16px;border-right:2px dashed var(--line);display:flex;flex-direction:column;gap:2px;border-radius:var(--r) 0 0 var(--r);
  background:linear-gradient(var(--pc),var(--pc)) left top/4px 100% no-repeat}
/* punched notches where the stub tears off */
.stub:before,.stub:after{content:"";position:absolute;right:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.stub:before{top:-10px}.stub:after{bottom:-10px}
.stub .ref{font-weight:700;font-size:14px;color:var(--head);font-variant-numeric:tabular-nums;font-stretch:112%}
.stub .pri{font-size:12px;font-weight:600;color:var(--pc)}
.stub .when{font-size:12px;color:var(--mut);margin-top:auto;padding-top:10px}
.tbody{padding:16px 20px 16px 22px;min-width:0}
.thead{align-items:flex-start}
.thead .ttl{flex:1;min-width:180px;font-size:16px;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--mut);margin-top:4px}
.meta b{font-weight:600;color:var(--ink)}
.desc{margin:10px 0 0;color:#2b3850;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.tfoot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ticket detail */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 20px;margin:16px 0;padding:14px 16px;background:var(--soft);border-radius:var(--r-sm)}
.dgrid>div>span{display:block;font-size:12px;color:var(--mut);font-weight:500}
.dgrid b{font-size:13px;font-weight:600}
.track{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 4px;padding:0;counter-reset:s}
.track li{position:relative;padding-top:22px;font-size:13px;font-weight:600;color:var(--mut)}
.track li span{display:block;font-weight:400;font-size:12px}
.track li:before{content:"";position:absolute;top:4px;left:0;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line2);z-index:1}
.track li:after{content:"";position:absolute;top:9px;left:12px;right:0;height:2px;background:var(--line)}
.track li:last-child:after{display:none}
.track li.done{color:var(--head)}
.track li.done:before{background:var(--navy);border-color:var(--navy)}
.track li.done:after{background:var(--navy)}
.track li.now:before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px rgba(229,0,25,.15)}
.track.s-3 li.now:before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px rgba(30,125,58,.15)}

/* timeline & comments */
.tl{display:flex;flex-direction:column;gap:12px;margin:4px 0 8px}
.ev{display:flex;gap:10px;align-items:baseline;font-size:13px;flex-wrap:wrap}
.ev:not(.cm)>.mut{margin-left:auto}
.evdot{width:8px;height:8px;border-radius:50%;background:var(--gray);flex:none}
.ev.k-resolved .evdot{background:var(--ok)}.ev.k-reopened .evdot{background:var(--amber)}.ev.k-started .evdot{background:var(--blue)}.ev.k-created .evdot{background:var(--navy)}
.ev.cm{flex-direction:column;align-items:flex-start;gap:4px}
.bub{background:var(--soft);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;white-space:pre-wrap;max-width:85%;word-break:break-word}
.ev.cm.mine{align-items:flex-end}
.ev.cm.mine .bub{background:var(--navy);color:#fff;border-color:var(--navy);border-radius:14px 4px 14px 14px}

/* ratings */
.rate{display:flex;align-items:center;gap:2px;margin-top:12px;flex-wrap:wrap}.rate>span{margin-right:8px}
.star{border:none;background:none;font-size:24px;color:#cfd5dd;padding:0 2px;line-height:1;transition:transform .15s var(--spring),color .15s}
.rate:hover .star{color:#f2b01e}.rate .star:hover~.star{color:#cfd5dd}.star:hover{transform:scale(1.2)}
.stars{color:#f2b01e;letter-spacing:1px;white-space:nowrap}

/* notifications */
.nlist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.nitem{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font-weight:500;padding:12px 14px;background:#fff;color:var(--mut);border-color:var(--line)}
.nitem.unread{background:#f3f7fd;border-color:#c9d8ee;color:var(--tx)}
.nitem .ndot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}.nitem.unread .ndot{background:var(--red)}
.nitem .ntext{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.nitem .go{color:var(--blue);font-weight:600}

/* stats & dashboards */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:#fff}
.tile b{display:block;font-size:28px;font-weight:700;color:var(--head);line-height:1.15;font-stretch:112%;font-variant-numeric:tabular-nums}
.tile>span{font-size:12px;color:var(--mut);font-weight:500}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.agrid .card{margin:0;display:flex;flex-direction:column}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.st:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-Available{color:var(--ok);background:#e8f5ec}.st-Working{color:var(--blue);background:#e8eff9}.st-Assigned{color:var(--amber);background:#fdf3e4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.stats div{text-align:center}.stats b{display:block;font-size:18px;color:var(--head);font-variant-numeric:tabular-nums}
.stats>div>span{font-size:11px;color:var(--mut);font-weight:500}
.cur{margin:12px 0;display:flex;flex-direction:column;gap:6px}
.cur button{text-align:left;font-weight:500;display:flex;gap:8px;align-items:center;width:100%;border-color:var(--line)}
.cur button b{color:var(--head);font-variant-numeric:tabular-nums}
.cur .none{color:var(--mut);font-size:13px;padding:8px 0}
.hist td{white-space:nowrap}
.hist .ck{width:36px;padding-right:0}.hist .ck input{width:18px;height:18px;accent-color:var(--navy);cursor:pointer;margin:0;vertical-align:middle}
.hrow.sel{background:#eef4fc}.hrow.sel:hover{background:#e5eefa}.hist td.tt{white-space:normal;min-width:180px}
.hrow{transition:background-color .15s}.hrow:hover{background:var(--soft)}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.flt select,.flt input{width:auto;flex:1;min-width:150px}
.qbox{background:var(--soft);border-radius:var(--r-sm);padding:10px 12px;font-weight:600;color:var(--head);margin-top:4px}

/* filter chips */
.chips button{border-radius:99px;padding:6px 14px;border-color:var(--line2)}
.chips button.g{background:var(--navy);border-color:var(--navy)}

/* ---------- auth screens ---------- */
.auth{max-width:860px;margin:0 auto;padding:0;display:flex;overflow:hidden;border:0;box-shadow:0 1px 2px rgba(0,28,67,.06),0 12px 40px rgba(0,28,67,.10)}
.auth .art{flex:1;min-height:420px;background:#fff center/cover no-repeat}
.auth .fm{flex:1;padding:36px 36px 30px;min-width:280px}
.auth .fm img{height:64px;display:block;margin-bottom:14px}
.auth h2{font-size:22px;color:var(--head);margin-bottom:6px}
.auth.reg{max-width:460px;display:block}
.auth.reg .fm{padding:36px;border-top:5px solid var(--navy)}
.ic{width:52px;height:52px;border-radius:50%;background:#e8f5ec;color:var(--ok);display:grid;place-items:center;font-size:26px;font-weight:700;margin:6px 0 12px}
.mailtip{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);background:#f3f7fd;border:1px solid #c9d8ee;font-size:13px}
.mailtip b{color:var(--head)}
.mailtip ol{margin:6px 0 0;padding-left:18px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 28px rgba(0,28,67,.25);z-index:9;max-width:calc(100% - 32px);
  transition:opacity .25s,transform .3s var(--spring);opacity:0;transform:translate(-50%,16px)}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red)}

/* ---------- motion (only on real moments) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08) translate(-1.5%,-1%)}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(12deg)}30%{transform:rotate(-10deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(2deg)}}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flash{0%{box-shadow:0 0 0 3px rgba(15,76,156,.45)}100%{box-shadow:0 0 0 0 rgba(15,76,156,0)}}
@keyframes shimmer{from{background-position:-400px 0}to{background-position:400px 0}}
@keyframes checkPop{0%{transform:scale(0) rotate(-45deg);opacity:0}60%{transform:scale(1.15) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes starPop{0%{transform:scale(1)}50%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(180,83,9,0)}50%{box-shadow:0 0 0 4px rgba(180,83,9,.18)}}
@keyframes tear{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
#main.anim .card,#main.anim .tile,#main.anim .banner,#main.anim>.row,#main.anim .flt,#main.anim .hint{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
#main.anim .tcard .stub{animation:tear .5s var(--ease) both;animation-delay:calc(120ms + var(--i,0)*40ms)}
#main.anim .hrow{animation:fadeIn .4s ease both;animation-delay:calc(120ms + var(--i,0)*30ms)}
#main.anim .nitem{animation:slideL .35s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
#main.anim .tl .ev{animation:fadeIn .35s ease both;animation-delay:calc(150ms + var(--i,0)*35ms)}
#pane .auth{animation:popIn .5s var(--ease) both}
#pane .auth .fm>*{animation:rise .45s var(--ease) both}
#pane .auth .fm>*:nth-child(2){animation-delay:.06s}#pane .auth .fm>*:nth-child(3){animation-delay:.12s}#pane .auth .fm>*:nth-child(4){animation-delay:.18s}#pane .auth .fm>*:nth-child(n+5){animation-delay:.24s}
.auth .art{animation:kenburns 20s ease-in-out infinite alternate}
.ic{animation:checkPop .6s var(--spring) .15s both}
.shake{animation:shake .45s ease}
.loading{color:transparent!important;background:linear-gradient(90deg,#f2f3f5 0,#e6e8eb 40%,#f2f3f5 80%) 0 0/800px 100%;animation:shimmer 1.3s linear infinite;border-color:transparent;min-height:56px;max-width:860px;margin:0 auto}
.bell.ring svg{animation:ring .9s ease;transform-origin:50% 0}.bell.ring b{animation:badgePop .45s var(--spring)}
.nitem.unread .ndot{animation:pulse 1.8s ease-out infinite;color:rgba(229,0,25,.5)}
.st-Working:before{animation:pulse 1.6s ease-out infinite;color:rgba(15,76,156,.45)}
.tag.over{animation:glow 2s ease-in-out infinite}
.flash{animation:flash 1.6s ease-out}
.ev.new{animation:slideL .45s var(--ease) both}.ev.cm.mine.new{animation-name:slideR}
.stars.pop{display:inline-block;animation:starPop .5s var(--spring)}

/* ---------- small screens: rail becomes a top bar with scrolling tabs ---------- */
@media (max-width:860px){
  .app{display:block}
  #side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;padding:0;overflow:visible}
  #side:after{top:auto;bottom:0;width:100%;height:4px;background:linear-gradient(90deg,var(--navy) 0 25%,var(--red) 25% 50%,var(--gray) 50% 62%,var(--blue) 62% 100%)}
  .brand,#me{display:none}
  #nav{flex-direction:row;overflow-x:auto;padding:8px 10px 12px;gap:4px;scrollbar-width:none;width:100%}
  #nav::-webkit-scrollbar{display:none}
  #nav button{width:auto;white-space:nowrap;padding:8px 12px;font-size:13px}
  #nav button.on:before{left:10px;right:10px;top:auto;bottom:-6px;width:auto;height:3px;border-radius:3px}
  #top{padding:14px 16px 0;flex-wrap:wrap}
  #top .toplogo{display:block;height:34px}
  #ptitle{font-size:20px;order:3;flex-basis:100%}
  .wrap{padding:14px 16px 40px}
  .mob{display:inline-flex!important}
  .bell .lbl{display:none}
  .tcard{grid-template-columns:1fr}
  .stub{flex-direction:row;align-items:baseline;gap:12px;border-right:0;border-bottom:2px dashed var(--line);border-radius:var(--r) var(--r) 0 0;padding:12px 16px;
    background:linear-gradient(var(--pc),var(--pc)) left top/100% 4px no-repeat}
  .stub:before,.stub:after{display:none}
  .stub .when{margin:0 0 0 auto;padding:0}
  .tbody{padding:14px 16px}
  .auth .fm{padding:28px 22px}
  .auth .art{display:none}
  .track li{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ---------- photo attachments ---------- */
.att-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.att-btn{display:inline-flex;align-items:center;gap:8px;margin:0;cursor:pointer;border:1px dashed var(--line2);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;transition:border-color .18s,background-color .18s}
.att-btn:hover{border-color:var(--blue);background:var(--soft)}
.att-btn:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.att-pend{display:flex;gap:8px;flex-wrap:wrap}.att-pend:not(:empty){margin-top:10px}
.att-chip{position:relative;width:76px;height:76px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.att-chip img{width:100%;height:100%;object-fit:cover;display:block}
.att-chip button{position:absolute;top:4px;right:4px;width:24px;height:24px;padding:0;border-radius:50%;border:0;background:rgba(0,20,50,.75);color:#fff;font-size:16px;line-height:1}
.att-grid{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.att-th{padding:0;width:96px;height:96px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.att-th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s var(--ease)}
.att-th:hover img{transform:scale(1.06)}
.ev.cm.mine .att-grid{justify-content:flex-end}
body.dragging .att-btn{border-color:var(--blue);background:#eaf1fb;box-shadow:0 0 0 4px rgba(15,76,156,.15)}
#lb{position:fixed;inset:0;z-index:20;background:rgba(3,10,24,.86);display:grid;place-items:center;padding:24px;animation:fadeIn .2s ease}
#lb figure{margin:0;max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
#lb img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .3s var(--ease)}
#lb figcaption{display:flex;justify-content:space-between;gap:12px;color:#d6deea;font-size:13px}
#lb figcaption a{color:#fff;font-weight:600}
.lb-load{color:#fff;font-weight:600}
.lb-x{position:fixed;top:16px;right:16px;width:42px;height:42px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px}
.lb-x:hover{background:rgba(255,255,255,.25)}

/* ---------- settings ---------- */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:99px;padding:3px;background:var(--soft);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:7px 14px;display:inline-flex;align-items:center;gap:6px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,28,67,.15)}
.setrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0;padding-top:4px}
.setrow>div{flex:1;min-width:200px}.setrow b{display:block;font-size:14px;font-weight:600}
.danger{color:var(--red);border-color:#f2a3ad}
.danger:hover{border-color:var(--red);background:#fff5f6}
.danger.on{background:var(--red);color:#fff;border-color:var(--red)}
#me .tg{margin-top:2px}

body.out .homebtn{display:block}
@media (max-width:860px){.homebtn{display:block}#side:after{content:"";display:block}}

// Outlook, Hotmail, Live and MSN often move these emails to Junk; show them where to look.
const MS_MAIL=/@(outlook|hotmail|live|msn|passport)\.[a-z.]+$/i;
const SENDER=`noreply@${FIREBASE_CONFIG.authDomain}`;
function mailTip(email){

// ===== STARTUP: connects to Firebase, watches the login state and three live collections =====
async function init(){
  try{app=initializeApp(FIREBASE_CONFIG);const fs=getFirestore(app);auth=getAuth(app);
    db={collection:n=>({onSnapshot:(f,e)=>onSnapshot(collection(fs,n),f,e),doc:id=>({set:d=>setDoc(doc(fs,n,id),d),update:d=>updateDoc(doc(fs,n,id),d),delete:()=>deleteDoc(doc(fs,n,id)),get:async()=>{const x=await getDoc(doc(fs,n,id));return x.exists()?x.data():null}})})}}catch(e){db=null}
  if(!db){$('#pane').innerHTML='<div class="card err">Shared database is unavailable. Check the Firebase settings at the top of the script.</div>';return}
  const fail=e=>{$('#pane').innerHTML=`<div class="card err">Could not reach the database (${esc(e.code||e.message)}). Check your connection and Firestore rules, then refresh.</div>`};
  onAuthStateChanged(auth,u=>{authUser=u;ready|=8;sync()});
  col('users').onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));
    if(s.empty&&!s.metadata.fromCache)hash('admin123').then(h=>col('users').doc('admin').set({name:'System Admin',role:'admin',pw:h,mustChange:true}));
    ready|=1;sync()},fail);
  col('tickets').onSnapshot(s=>{tickets=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created);ready|=2;sync()},fail);
  col('notifs').onSnapshot(s=>{notifs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);ready|=4;sync()},fail);
}
// ===== WHO IS LOGGED IN: email session (Firebase Auth) first, then legacy username session =====
function resolveMe(){
  if(authUser){
    const u=users.find(x=>x.uid===authUser.uid);
    if(u&&u.disabled){authNote='This account has been deactivated. Contact an admin.';signOut(auth);return null}
    if(u)return u;
    // Signed in with Firebase but no profile yet (e.g. profile save failed during sign up): create one
    // Wait a few seconds first so a sign-up that is still saving isn't overwritten
    if(!signingUp&&!creatingDoc){creatingDoc=true;const au=authUser;setTimeout(()=>{
      if(authUser!==au||signingUp||users.some(x=>x.uid===au.uid)){creatingDoc=false;return}
      col('users').doc(au.uid).set({name:(au.email||'user').split('@')[0],role:'client',email:au.email,uid:au.uid,selfSignup:true,created:Date.now()}).catch(()=>{}).finally(()=>creatingDoc=false)},3000)}
    return null;
  }
  const sid=ss('u');if(!sid)return null;
  const u=users.find(x=>x.id===sid);
  if(!u||u.uid||u.disabled){ss('u',null);return null}
  return u;
}

// ===== LOGIN / SIGN UP / FORGOT PASSWORD SCREENS =====
function authUI(){
  const p=$('#pane');p.dataset.a=authKey();$('#main').innerHTML='';
  const back=`<button type="button" data-a="mode" data-v="login" class="link">Back to log in</button>`;
  let html;
  if(authMode==='login'){
    html=card(`<h2>Log in</h2>
    <form data-f="login" novalidate><label for="au">Email</label><input id="au" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" value="${esc(prefill)}" required>
    <label for="ap">Password</label>
    ${pwField('ap','current-password')}
    <div style="text-align:right;margin-top:4px"><button type="button" class="link sm" data-a="mode" data-v="forgot">Forgot password?</button></div>
    ${capsHint}<div class="err" role="alert">${esc(authNote)}</div>
    <div class="row" style="margin-top:14px"><button class="p" type="submit">Log in</button><button type="button" data-a="mode" data-v="reg">Create account</button></div></form>`,true);
  }else if(authMode==='reg'){
    html=card(`<h2>Create your account</h2><div class="mut" style="margin-bottom:6px">Sign up with your email to submit and track your own tickets. We'll send you a link to confirm it.</div>
    <form data-f="reg" novalidate><label for="an">Full name</label><input id="an" autocomplete="name" placeholder="e.g. Juan Dela Cruz" required>
    <label for="ae">Email</label><input id="ae" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required>
    <label for="ap">Password</label>${pwField('ap','new-password',true)}
    <label for="ac">Confirm password</label>${pwField('ac','new-password')}${capsHint}
    <div class="err" role="alert"></div>
    <div style="margin-top:14px"><button class="p" type="submit" style="width:100%">Sign up</button></div></form>
    <button type="button" data-a="mode" data-v="login" class="link">I already have an account</button>`);
  }else if(fStep==='user'){
    html=card(`<h2>Reset your password</h2><div class="mut" style="margin-bottom:6px">Enter your email and we'll send you a link to set a new password.</div>
    <form data-f="forgot" novalidate><label for="fu">Email</label><input id="fu" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" value="${esc(fUser||prefill)}" required>
    <div class="err" role="alert"></div><div style="margin-top:14px"><button class="p" type="submit" style="width:100%">Send reset link</button></div></form>${back}`);
  }else if(fStep==='mail'){
    html=card(doneIc('Check your email',`If an account exists for <b>${esc(fMail)}</b>, a password reset link is on its way. It can take a minute.`)+mailTip(fMailReal)+
    `<div class="err" role="alert"></div><div style="margin-top:6px"><button class="p" data-a="mode" data-v="login" style="width:100%">Back to log in</button></div><div class="row" style="justify-content:space-between"><button class="link" data-a="fresend">Send the link again</button><button class="link" data-a="mode" data-v="forgot">Use a different email</button></div>`);
  }else if(fStep==='noq'){
    const fu=users.find(x=>x.id===fUser);
    html=card(`<h2>Reset your password</h2><div class="mut" style="margin-bottom:6px">The account <b>@${esc(fUser)}</b> doesn't have an email yet, so we can't send a reset link.</div>
    <form data-f="askadmin" novalidate><p>An admin can reset it for you. They'll give you a temporary password, and you'll choose a new one when you log in. After that, add your email in <b>My account</b> so this is automatic next time.</p>
    ${fu&&fu.resetReq?`<div class="okm">A request is already pending (sent ${ago(fu.resetReq)}). You can send a reminder.</div>`:''}
    <div class="err" role="alert"></div><div style="margin-top:14px"><button class="p" type="submit" style="width:100%">${fu&&fu.resetReq?'Send reminder':'Ask an admin to reset it'}</button></div></form>${back}`);
  }else{
    html=card(doneIc('Request sent','An admin has been notified. Ask them for your temporary password (in person or through your official channel); you\'ll set a new one right after logging in.')+`<button class="p" data-a="mode" data-v="login" style="width:100%">Back to log in</button>`);
  }
  p.innerHTML=html;
  const first=p.querySelector('input:not([value]),input[value=""]')||p.querySelector('input');
  if(first)setTimeout(()=>first.focus(),0);
}
// ===== VERIFY EMAIL: new self-signups confirm their address before using the app =====
function verifyUI(){
  const p=$('#pane');p.dataset.a='verify';

// ===== FORM SUBMIT LOGIC =====
const checkNew=(np,nc)=>pwRule(np)||(np!==nc?'Passwords don\'t match.':'');
function afterLogin(plain){prefill='';authNote='';weak=!!pwRule(plain)||plain==='admin123';view='tickets';filter='All';q='';fails=0}
async function reqReset(){
  const u=users.find(x=>x.id===fUser);if(!u){fStep='user';return authUI()}
  await col('users').doc(u.id).update({resetReq:Date.now()});
  active().filter(a=>a.role==='admin').forEach(a=>notify(a.id,`${u.name} (@${u.id}) requested a password reset. Open Users to issue a temporary password.`));
  fStep='sent';authUI();
}
function failLogin(f,msg){
  if(++fails>=MAX_FAILS){fails=0;lockUntil=Date.now()+LOCK_MS;return showErr(f,'Too many failed attempts. Please wait 30 seconds, or use "Forgot password?".')}
  $('#ap').value='';$('#ap').focus();showErr(f,`${msg} ${MAX_FAILS-fails} attempt${MAX_FAILS-fails===1?'':'s'} left.`);
}
const FORMS={
  async login(f){
    if(Date.now()<lockUntil)return showErr(f,`Too many failed attempts. Try again in ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`);
    const id=$('#au').value.trim(),p=$('#ap').value;
    if(!id||!p)return showErr(f,'Enter your email and password.');
    authNote='';
    if(id.includes('@')){
      try{await signInWithEmailAndPassword(auth,id,p)}
      catch(e){return ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(e.code)?failLogin(f,'Wrong email or password.'):showErr(f,fe(e))}
      ss('u',null);afterLogin(p);
      const u=users.find(x=>x.uid===auth.currentUser.uid);if(u)col('users').doc(u.id).update({lastLogin:Date.now()}).catch(()=>{});
      return sync();
    }
    // Legacy username login
    const u=id.toLowerCase(),ex=users.find(x=>x.id===u);
    if(ex&&ex.uid)return showErr(f,`This account now signs in with its email (${maskMail(ex.email)}).`);
    if(ex&&ex.disabled)return showErr(f,'This account has been deactivated. Contact an admin.');
    if(!ex||!(await verify(p,ex.pw)))return failLogin(f,'Wrong email or password.');
    const upd={lastLogin:Date.now()};if(!ex.pw.startsWith('pbkdf2$'))upd.pw=await hash(p);
    try{await col('users').doc(u).update(upd)}catch(e){}
    ss('u',u);afterLogin(p);sync();
  },
  async reg(f){
    const name=$('#an').value.trim(),email=$('#ae').value.trim().toLowerCase(),p=$('#ap').value;
    const e=(!name&&'Enter your full name.')||(!EMAIL_RE.test(email)&&'Enter a valid email address.')||checkNew(p,$('#ac').value);
    if(e)return showErr(f,e);
    signingUp=true;
    try{
      const cred=await createUserWithEmailAndPassword(auth,email,p);
      await col('users').doc(cred.user.uid).set({name,role:'client',email,uid:cred.user.uid,selfSignup:true,created:Date.now(),lastLogin:Date.now()});
      verifyErr='';try{await sendVerify(cred.user)}catch(err){verifyErr=fe(err)+(err.code?` (${err.code})`:'')}
      resendAt=Date.now();ss('u',null);afterLogin(p);
    }catch(err){return showErr(f,fe(err))}
    finally{signingUp=false}
    sync();
  },
  async forgot(f){
    const v=$('#fu').value.trim();if(!v)return showErr(f,'Enter your email address.');
    fUser=v;
    if(v.includes('@')){
      if(!EMAIL_RE.test(v))return showErr(f,'Enter a valid email address.');
      try{await sendReset(auth,v.toLowerCase())}catch(e){if(e.code!=='auth/user-not-found')return showErr(f,fe(e))}
      fMail=v.toLowerCase();fMailReal=fMail;resetAt=Date.now();fStep='mail';return authUI();
    }
    const ex=users.find(x=>x.id===v.toLowerCase());
    if(!ex)return showErr(f,'We couldn\'t find an account with that email.');
    if(ex.email){try{await sendReset(auth,ex.email)}catch(e){return showErr(f,fe(e))}fMail=maskMail(ex.email);fMailReal=ex.email;resetAt=Date.now();fStep='mail';return authUI()}
    fUser=ex.id;fStep='noq';authUI();
  },
  askadmin:reqReset,
  async force(f){
    const np=$('#fp').value,e=checkNew(np,$('#fc').value);if(e)return showErr(f,e);
    if(np==='admin123')return showErr(f,'Choose a password other than the default one.');
    await col('users').doc(me.id).update({pw:await hash(np),mustChange:false,resetReq:0});
    me={...me,mustChange:false};weak=false;$('#pane').dataset.a='';$('#pane').innerHTML='';toast('Password saved. You\'re all set.');head();render();
  },
  async acctpw(f){
    const cp=$('#cp').value,np=$('#np2').value,e=checkNew(np,$('#nc2').value);
    if(isEmailAcct(me)){
      try{await reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(auth.currentUser.email,cp))}catch(err){return showErr(f,['auth/invalid-credential','auth/wrong-password'].includes(err.code)?'Current password is incorrect.':fe(err))}
      if(e)return showErr(f,e);
      try{await updatePassword(auth.currentUser,np)}catch(err){return showErr(f,fe(err))}
    }else{
      if(!(await verify(cp,me.pw)))return showErr(f,'Current password is incorrect.');
      if(e)return showErr(f,e);
      await col('users').doc(me.id).update({pw:await hash(np)});
    }
    weak=false;f.reset();toast('Password updated.');render();
  },
  async name(f){
    const v=$('#fn2').value.trim();
    if(!v)return showErr(f,'Enter your name.');
    await col('users').doc(me.id).update({name:v});
    me={...me,name:v};toast('Name updated.');head();render();
  }
};
document.addEventListener('submit',async e=>{
  const f=e.target,fn=FORMS[f.dataset.f];if(!fn)return;e.preventDefault();if(busy)return;busy=true;
  const btn=f.querySelector('[type=submit]'),lbl=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='Please wait…'}

// ===== PHOTO ATTACHMENTS =====
// Photos are shrunk in the browser (max ~700 KB) and saved in Firestore's "files" collection,
// so no paid Firebase Storage plan is needed. Tickets and comments keep a small thumbnail + the file id;
// the full photo is only downloaded when someone opens it.
const MAX_ATT=3,attPend={nt:[],cmt:[]},fileCache={};
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That file isn\'t an image we can read.'))};i.src=u})}
function toJpeg(img,max,q){const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*r));c.height=Math.max(1,Math.round(img.naturalHeight*r));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function prepImage(file){
  if(!/^image\//.test(file.type||''))throw new Error('Only images can be attached (JPG, PNG or a screenshot).');
  if(file.size>20e6)throw new Error('That image is over 20 MB. Try a smaller one.');
  const img=await loadImg(file);let max=1600,q=.82,data=toJpeg(img,max,q);
  while(data.length>700000&&max>480){max=Math.round(max*.8);q=Math.max(.55,q-.07);data=toJpeg(img,max,q)}
  return{data,th:toJpeg(img,220,.7),name:(file.name||'screenshot').slice(0,80)};
}
async function addFiles(key,files){
  const list=[...(files||[])].filter(Boolean);if(!list.length)return;
  for(const f of list){
    if(attPend[key].length>=MAX_ATT){toast(`You can attach up to ${MAX_ATT} photos at a time.`,1);break}
    try{attPend[key].push(await prepImage(f))}catch(e){toast(e.message,1)}
  }
  drawPend(key);
}
const pendHTML=key=>`<div class="att-pend" id="pend-${key}">${attPend[key].map((p,i)=>`<div class="att-chip"><img src="${p.th}" alt="${esc(p.name)}"><button type="button" data-a="attrm" data-k="${key}" data-i="${i}" aria-label="Remove ${esc(p.name)}">×</button></div>`).join('')}</div>`;
function drawPend(key){const el=document.getElementById('pend-'+key);if(el)el.outerHTML=pendHTML(key)}
const attPicker=(key,label)=>`<div class="att-row"><label class="att-btn" for="f-${key}">${ic('image',16)}<span>${label||'Add photo'}</span></label><input type="file" id="f-${key}" accept="image/*" multiple hidden data-k="${key}"><span class="mut">or paste a screenshot with Ctrl+V. Up to ${MAX_ATT} photos.</span></div>${pendHTML(key)}`;
// Saves the pending photos and returns [{id,th,name}] for the ticket or comment
async function uploadPend(key,ticketId){
  const out=[];
  for(const p of attPend[key]){
    const fid='f'+Date.now()+Math.random().toString(36).slice(2,7);
    await col('files').doc(fid).set({data:p.data,name:p.name,by:me.id,ticket:ticketId,ts:Date.now()});
    out.push({id:fid,th:p.th,name:p.name});
  }
  return out;
}

// ===== ANIMATIONS AFTER EACH REDRAW =====
// - New screen (tab change, opening a ticket): cards rise in one by one and numbers count up.
// - Same screen refreshed by live data: nothing replays, but a ticket whose status/assignee
//   just changed gets a short blue highlight so you notice it.
function afterRender(m,anim){
  if(anim){
    let i=0;m.querySelectorAll('.card,.tile,.banner,nav+.row,.flt,.hint').forEach(el=>el.style.setProperty('--i',Math.min(i++,12)));
    m.querySelectorAll('.hrow,.nitem,.tl .ev').forEach((el,j)=>el.style.setProperty('--i',Math.min(j,15)));
    void m.offsetWidth;m.classList.add('anim');
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)m.querySelectorAll('.tile>b,.stats b').forEach(countUp);
  }
  const fresh=!Object.keys(seenT).length;
  m.querySelectorAll('.tcard[data-id],.tdet[data-id]').forEach(el=>{
    const t=tickets.find(x=>x.id===el.dataset.id);if(!t)return;
    const sig=t.status+'|'+t.to+'|'+(t.comments||[]).length;
    if(!anim&&!fresh&&seenT[t.id]&&seenT[t.id]!==sig)replay(el,'flash');
  });
  tickets.forEach(t=>seenT[t.id]=t.status+'|'+t.to+'|'+(t.comments||[]).length);
}
// Counts a number up from 0 (keeps any suffix like "h", "%" or the star)
function countUp(b){
  const tn=b.firstChild;if(!tn||tn.nodeType!==3)return;
  const mt=tn.nodeValue.match(/^(\d+(?:\.\d+)?)(.*)$/);if(!mt)return;
  const end=parseFloat(mt[1]),dec=(mt[1].split('.')[1]||'').length,suf=mt[2];if(!end)return;
  const t0=performance.now(),D=700;
  const step=now=>{const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);tn.nodeValue=(end*e).toFixed(dec)+suf;if(p<1&&tn.isConnected)requestAnimationFrame(step)};
  tn.nodeValue=(0).toFixed(dec)+suf;requestAnimationFrame(step);
}

// ===== AGENT STATUS DASHBOARD (ADMIN ONLY) =====
// Status: Working = has a ticket In Progress · Assigned = has open ticket(s) not started yet · Available = nothing active
function agentStats(){
  const wk=Date.now()-7*864e5;
  return active().filter(u=>u.role==='agent').map(a=>{

    notify(to,`You were assigned ${t.ref}: ${t.title}`,id);notify(t.by,`Your ticket ${t.ref} was assigned to ${uname(to)}`,id);toast(`${t.ref} assigned to ${uname(to)}.`);
  }
  else if(a==='start'){const t=tickets.find(x=>x.id===id);await col('tickets').doc(id).update({status:'In Progress',started:Date.now(),log:logE(t,'started')});notify(t.by,`Work started on your ticket ${t.ref}`,id)}
  else if(a==='resolve'){
    const t=tickets.find(x=>x.id===id),note=($('#rn-'+id).value||'').trim()||'Resolved';
    const cb=$('#rs-'+id),noteSent=cb?cb.checked:true;
    await col('tickets').doc(id).update({status:'Resolved',note,noteSent,resolved:Date.now(),resolvedBy:me.id,log:logE(t,'resolved')});
    notify(t.by,noteSent?`Your ticket ${t.ref} was resolved: ${note}`:`Your ticket ${t.ref} was resolved.`,id);
    active().filter(u=>u.role==='admin'&&u.id!==me.id).forEach(u=>notify(u.id,`${t.ref} marked resolved by ${me.name}`,id));
    toast(`${t.ref} marked as resolved.`);
  }
  else if(a==='mk'){
    if(busy)return;
    const name=$('#mn').value.trim(),email=$('#mm').value.trim().toLowerCase(),role=$('#mr').value;
    const err=(!name&&'Enter their full name.')||(!EMAIL_RE.test(email)&&'Enter a valid email address.')||(users.some(u=>u.email===email)&&'An account with this email already exists.');
    if(err){$('#me').textContent=err;return}
    busy=true;b.disabled=true;b.textContent='Creating…';
    // A second Firebase connection creates the account, so the admin stays logged in
    try{const a2=secondaryAuth(),cred=await createUserWithEmailAndPassword(a2,email,tempPw());
      await col('users').doc(cred.user.uid).set({name,role,email,uid:cred.user.uid,invited:true,created:Date.now()});
      await sendReset(a2,email);await signOut(a2).catch(()=>{});
      view='users';toast(`Invite sent to ${email}.`);render();
    }catch(e2){$('#me').textContent=fe(e2);b.disabled=false;b.textContent='Create and send invite'}
    finally{busy=false}
  }
  else if(a==='resetpw'){
    if(!b.dataset.now&&rstAsk!==id){rstAsk=id;render();return}
    const u=users.find(x=>x.id===id);rstAsk='';
    try{
      if(u.email){await sendReset(auth,u.email);if(u.resetReq)await col('users').doc(id).update({resetReq:0});toast(`Reset link sent to ${u.email}.`)}
      else{const p=tempPw();await col('users').doc(id).update({pw:await hash(p),mustChange:true,resetReq:0});notify(id,'An admin reset your password. Use the temporary password they gave you, then choose a new one.');tempShown={id,pw:p}}
    }catch(err){toast('Could not reset: '+fe(err),1)}
    render();
  }
  else if(a==='dismissreq'){await col('users').doc(id).update({resetReq:0});toast('Request dismissed.')}
  else if(a==='copytmp'){try{await navigator.clipboard.writeText(tempShown.pw);toast('Copied to clipboard.')}catch(err){toast('Copy failed. Select the text and copy it manually.',1)}}
  else if(a==='donetmp'){tempShown=null;render()}
  else if(a==='delticket'){
    if(delT!==id){delT=id;render();return}
    try{await wipeTicket(tickets.find(x=>x.id===id)||{id});toast('Ticket deleted.')}catch(err){toast('Could not delete: '+fe(err),1)}
    delT='';if(view==='ticket')view=backTo;render();
  }
  else if(a==='deluser'){
    if(delAsk!==id){delAsk=id;render();return}
    // Removes the Firestore profile. If this account has a Firebase login (a uid), that
    // login still exists in Firebase Authentication and has to be deleted there separately,
    // the browser can't delete another account's Firebase login.
    try{await col('users').doc(id).delete();toast('Account removed.')}catch(err){toast('Could not remove: '+fe(err),1)}
    delAsk='';render();
  }
});
document.addEventListener('change',e=>{const s=e.target;
  if(s.id==='sort'){sortBy=s.value;return render()}
  if(s.id==='hall'){document.querySelectorAll('.hrow:not([hidden]) .hsel').forEach(c=>s.checked?hSel.add(c.dataset.id):hSel.delete(c.dataset.id));clrAsk='';return render()}
  if(s.classList&&s.classList.contains('hsel')){s.checked?hSel.add(s.dataset.id):hSel.delete(s.dataset.id);clrAsk='';return render()}
  if(s.id==='hRange'){hRange=s.value;return render()}if(s.id==='hAgent'){hAgent=s.value;return render()}if(s.id==='hCat'){hCat=s.value;return render()}
  if(s.dataset&&s.dataset.a==='role')col('users').doc(s.dataset.id).update({role:s.value}).then(()=>toast('Role updated.'))});
// ===== LIVE INPUT: ticket search + password strength meter =====
const LV=[['Too short','#e50019'],['Weak','#e50019'],['Fair','#d97706'],['Good','#0f4c9c'],['Strong','#1e7d3a'],['Very strong','#1e7d3a']];
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){q=t.value;applySearch();return}
  if(t.id==='hq'){hq=t.value;applyHSearch();return}
  const bar=document.getElementById(t.id+'-bar');if(!bar)return;
  const p=t.value;let sc=p.length<8?0:1+(p.length>=12)+(/[a-z]/.test(p)&&/[A-Z]/.test(p))+/\d/.test(p)+/[^a-z0-9]/i.test(p);sc=Math.min(sc,5);
  bar.style.width=(p?Math.max(sc,.5)*20:0)+'%';bar.style.background=LV[sc][1];
  const m=document.getElementById(t.id+'-m');if(m)m.textContent=p?(pwRule(p)?LV[sc][0]+': '+pwRule(p):LV[sc][0]):'At least 8 characters with a letter and a number.';
});
['keydown','keyup'].forEach(ev=>document.addEventListener(ev,e=>{const c=$('#caps');if(c&&e.target.closest&&e.target.closest('.pw')&&e.getModifierState)c.hidden=!e.getModifierState('CapsLock')}));
// ===== START THE APP =====
init();
</script></body></html>
